name: Installer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test examples/delivery-board/tests/*.test.mjs
      - run: python3 ../../scripts/vault.py check --json
        working-directory: examples/delivery-board
      - run: node examples/delivery-board/package.mjs "$RUNNER_TEMP/public-pilot" "$GITHUB_SHA"
      - run: python3 -B tests/smoke_public_pilot.py --root "$RUNNER_TEMP/public-pilot-adoption" --client both
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check Bash syntax
        run: bash -n setup.sh
      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Exercise reversible adoption in all client profiles
        shell: bash
        run: |
          for client in claude codex both; do
            python3 -B tests/smoke_adoption.py --root "$RUNNER_TEMP/adoption-$client" --client "$client" || exit "$?"
          done
      - name: Prepare missions in new and existing consumers
        run: python3 -B tests/smoke_mission_foundation.py --root "$RUNNER_TEMP/mission-both" --client both
      - name: Exercise bounded diagnostic adoption without model calls
        run: python3 -B tests/smoke_mission_runtime.py --root "$RUNNER_TEMP/mission-runtime" --client both
  adoption-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Exercise the board in new and existing consumers
        run: python -B tests/windows_fixture_runner.py tests/smoke_public_pilot.py --root "$env:RUNNER_TEMP/public-pilot-adoption" --client both
      - name: Verify native storage, permissions and crash recovery
        run: python -B tests/windows_fixture_runner.py -m unittest discover -s tests -p "test_adoption*.py" -v -f
      - name: Verify trial installer and unchanged global profile
        run: python -B tests/windows_fixture_runner.py -m unittest discover -s tests -p test_setup.py -k trial -v -f
      - name: Exercise return through the external runner
        run: python -B tests/windows_fixture_runner.py tests/smoke_adoption.py --root "$env:RUNNER_TEMP/adoption-both" --client both
      - name: Prepare missions in new and existing consumers
        run: python -B tests/windows_fixture_runner.py tests/smoke_mission_foundation.py --root "$env:RUNNER_TEMP/mission-both" --client both
      - name: Verify mission diagnostics and process recovery
        run: python -B tests/windows_fixture_runner.py -m unittest discover -s tests -p "test_mission*.py" -v
      - name: Exercise bounded diagnostic adoption without model calls
        run: python -B tests/windows_fixture_runner.py tests/smoke_mission_runtime.py --root "$env:RUNNER_TEMP/mission-runtime" --client both
  graphify-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Seed disposable memory project
        run: python3.12 tests/smoke_memory.py --root .runtime/memory-proof --provider markdown
      - name: Install pinned optional runtime
        run: python3.12 scripts/memory.py --root .runtime/memory-proof setup-graphify
      - name: Exercise actual local Graphify and failure recovery
        run: python3.12 tests/smoke_memory.py --root .runtime/memory-proof --provider graphify
